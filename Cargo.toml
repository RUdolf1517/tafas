[package]
name = "tafas"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
description = "Capture a video from YouTube, TikTok, X, Vimeo, Reddit, SoundCloud or Twitch into one file — no re-encoding, no external binaries"
authors = ["RUdolf1517 <rudolfzinovev@protonmail.com>"]
license = "MIT"
repository = "https://github.com/RUdolf1517/tafas"
homepage = "https://github.com/RUdolf1517/tafas"
readme = "README.md"
keywords = ["cli", "youtube", "tiktok", "download", "video"]
categories = ["command-line-utilities", "multimedia"]

[lib]
name = "tafas"
path = "src/lib.rs"

[[bin]]
name = "tafas"
path = "src/main.rs"

[features]
# One feature per site. The default is all seven, so an ordinary build reads
# everything; `--no-default-features --features youtube` produces a binary that
# contains no code for the other six, which is smaller and can be audited by
# someone who only wants one site.
default = ["youtube", "tiktok", "x", "vimeo", "reddit", "soundcloud", "twitch"]
youtube = []
tiktok = []
x = []
vimeo = []
reddit = []
soundcloud = []
twitch = []

[dependencies]
# Argument parsing. `default-features = false` drops the derive-less colour and
# suggestion machinery that a tool printing plain GNU-style errors does not use;
# `error-context` is kept because a rejected value must say what was expected.
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
# Completions are generated from the live parser, so they cannot drift from
# `--help` the way a checked-in script can.
clap_complete = "4.5"

# Blocking HTTP client. Chosen over a hand-rolled HTTP/1.1 stack because the
# sites are behind redirects, chunked transfer and gzip, and a downloader's
# failure modes there are silent corruption rather than an error.
# No `http2`: `h2` and its `hyper` integration are the single largest optional
# piece of this graph, and every site here is reached over HTTP/1.1 with
# `Connection: keep-alive` — measured at 325 KB of an `opt-level = 3` build
# (223 KB with the `z` profile this crate now uses), for a protocol no site
# asks for.
# No `charset`: `encoding_rs` decodes a `Content-Type` charset for `.text()`,
# and this crate never calls it — every page is read through `read_bounded`,
# which is `String::from_utf8_lossy` over the bytes, because the sites are
# UTF-8 and a Latin-1 body with a mislabelled header is not made better by
# decoding it. Dropping the pair is 31 KB.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "rustls-tls-webpki-roots-no-provider",
] }

# TLS is rustls with the `ring` provider: no OpenSSL, no system libssl to link
# against, and one static binary. `ring` is the only dependency in the graph
# that carries C and assembly; docs/dependencies.md §3 states that plainly.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# JSON: every extractor speaks it, and so does `--json`.
serde_json = "1"

# AES-128-CBC, for the segments of an encrypted HLS playlist. RustCrypto, pure
# Rust — `ring` deliberately exposes only AEAD modes, and CBC is the mode the
# HLS specification names. See docs/dependencies.md §1.5.
aes = "0.8"
# `cbc` versions independently of `aes`: 0.1 is the release that pairs with
# `cipher` 0.4, and `block-padding` is opt-in there, which is where PKCS#7 lives.
cbc = { version = "0.1", features = ["block-padding"] }

[dev-dependencies]
# Tests spawn the real binary through CARGO_BIN_EXE_tafas, and the fixture HTTP
# server is std-only, so the test graph adds nothing that the binary does not
# already carry.

[profile.release]
# `z` and not `3`: this program is I/O bound — its time goes into waiting for a
# socket and into writing bytes it did not compute — so the 26% of binary size
# that `-Copt-level=3` buys over `z` is a download a user pays for and a start
# they cannot measure. Measured on one runner: 4 195 808 bytes at `3`,
# 3 101 160 at `z`, 2 878 392 for `z` with the two features above dropped. The
# `budgets` job measures the start itself and passed on those builds, so the
# size came for free; it refuses any build over its recorded size or start
# time, so the next growth is a diff.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[lints.rust]
unsafe_code = "forbid"
