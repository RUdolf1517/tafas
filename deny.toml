# cargo-deny configuration. Run with `cargo deny check`.
#
# The point of this file is that "MIT" on the badge is a claim the CI verifies,
# not a hope. See docs/dependencies.md for the reasoning behind each entry.

[advisories]
yanked = "deny"
# A RustSec advisory is fixed by upgrading; the ignore list is for a
# non-exploitable advisory that a dependency has not fixed yet, and every entry
# needs a comment saying why.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
# MPL-2.0 is file-scoped copyleft and does not affect this crate's licence.
# Anything not in the list above fails the build.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No crate is banned outright. `openssl-sys` would be a signal that the TLS
# choice in docs/dependencies.md has been undone, so it is denied explicitly.
deny = [
    { name = "openssl-sys", reason = "tafas links rustls, not OpenSSL (docs/dependencies.md §1.3)" },
    { name = "aws-lc-rs", reason = "the TLS provider is ring; aws-lc-rs would add a second, larger body of C" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
