name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  # The three platforms a downloader is expected to run on. No test touches the
  # network: the fixtures in `tests/` build their own HTTP server.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The generators are Python, and three of them produce files that ship.
      # They are exercised here rather than only in the release job, because a
      # generator that broke is a release that fails at 2 a.m.: `channels.py
      # --self-test` renders the AUR, Scoop and flake files from a stand-in
      # release and asserts the hashes and the versions in them, and the winget
      # generator is rendered against a stand-in archive and checked.
      - name: Channel generators
        id: channels
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/channels.py --self-test
          # The generator refuses an archive that is not exactly `tafas.exe` and
          # `LICENSE`, so the stand-in is a real ZIP with those two entries.
          mkdir -p /tmp/winget-check/build
          printf 'tafas.exe\n' > /tmp/winget-check/build/tafas.exe
          printf 'MIT\n' > /tmp/winget-check/build/LICENSE
          (cd /tmp/winget-check/build && python3 -c "import zipfile; \
            z = zipfile.ZipFile('../tafas-x86_64-pc-windows-msvc.zip', 'w'); \
            z.write('tafas.exe'); z.write('LICENSE'); z.close()")
          python3 packaging/winget/generate.py --tag v9.9.9 \
            --windows-archive /tmp/winget-check/tafas-x86_64-pc-windows-msvc.zip \
            --output-dir /tmp/winget-check/manifests
          python3 packaging/winget/tests/check.py /tmp/winget-check/manifests
          # The `.apk` packer. It replaced `apk mkpkg` in a container, which
          # never made a package: `mkpkg` is apk-tools 3 and `alpine:3.20` has
          # 2.14, and the v3 format it writes is unreadable to most installs
          # that install a package by path.
          python3 packaging/tests/apk.py

      - name: Clippy
        id: clippy
        if: steps.channels.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Test
        id: test
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: cargo test --all-targets 2>&1 | tee test.log

      # `success` and not `== 'success'`: `cargo test --all-targets` builds the
      # binary in debug, and the release build is the one that has to link, so
      # this step runs whenever nothing before it failed. The distinction cost a
      # whole green run: the step was silently skipped and the job still passed.
      - name: Release build
        id: build
        if: steps.clippy.outcome == 'success' && success()
        continue-on-error: true
        shell: bash
        run: cargo build --release 2>&1 | tee build.log

      - name: Publish the failure
        if: always() && (steps.channels.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a pull_request event `github.ref_name` is `<branch>/merge`, which
          # matches no branch that has a pull request, so the report was written
          # to the job log and lost exactly when it was needed.
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          # Only the steps that actually failed: a passing clippy log would
          # otherwise be published under a failing test's name.
          : > failure.md
          for pair in "clippy:${{ steps.clippy.outcome }}" "test:${{ steps.test.outcome }}" "build:${{ steps.build.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            [ "$outcome" = "failure" ] || continue
            log="${name}.log"
            [ -f "$log" ] || continue
            # Cargo's own progress lines are removed: a log where the errors are
            # buried under 200 "Downloaded" lines is a log nobody reads.
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" "$log" \
              | tail -n 120 > "failure-$name.txt" || true
            {
              echo "### \`${{ matrix.os }}\` — \`$name\`"
              echo '```'
              cat "failure-$name.txt"
              echo '```'
            } >> failure.md
          done

          cat failure.md
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          gh pr comment "$number" --body-file failure.md || true

      # `failure()` is true when any *previous* step failed, which is the whole
      # point of this step: the per-step conditions above were written one at a
      # time and did not survive a step being added beside them.
      - name: Fail the job
        if: failure()
        shell: bash
        run: exit 1

  # A downloader is allowed to grow; it is not allowed to grow silently. The two
  # numbers in `packaging/budgets.json` — the size of the binary and the time it
  # takes to print its own name — are compared against here, on one platform,
  # because a budget that is only printed is a budget nobody reads.
  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Check the budget
        id: budget
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 packaging/tests/budgets.py target/release/tafas | tee budget.log

      # Same reason as the `test` job: the numbers that failed are published
      # where the reader is, not only in a log this project cannot always reach.
      - name: Publish what was measured
        if: steps.budget.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `budgets` — the numbers this build has'
            echo '```'
            tail -n 40 budget.log
            echo '```'
          } > budget.md
          gh pr comment "$number" --body-file budget.md || true

      - name: Fail the job
        if: steps.budget.outcome == 'failure'
        shell: bash
        run: exit 1

  # `rust-version = "1.82"` is a promise, and a promise nobody builds is a wish.
  # One build at the declared floor is enough to notice a dependency that moved
  # it, which is the failure mode this job exists for.
  msrv:
    name: msrv (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"

      - name: Build at the declared floor
        id: floor
        continue-on-error: true
        shell: bash
        run: cargo build --locked --all-targets 2>&1 | tee msrv.log

      - name: Publish the failure
        if: steps.floor.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `msrv` — the declared floor does not build'
            echo '```'
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" msrv.log \
              | tail -n 80
            echo '```'
          } > msrv.md
          gh pr comment "$number" --body-file msrv.md || true

      - name: Fail the job
        if: steps.floor.outcome == 'failure'
        shell: bash
        run: exit 1

  # One feature per site is a promise about the binary, not a runtime check:
  # a build without Vimeo must contain no Vimeo code. This job builds both
  # halves of that promise — the full binary and a youtube-only one — and
  # `packaging/tests/features.py` says what is wrong if they disagree.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build every site
        shell: bash
        run: cargo build --release --locked

      - name: Build one site
        id: one
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A different target directory, so the full build below cannot be
          # served a binary that was compiled without the other six sites.
          CARGO_TARGET_DIR=target/one \
            cargo build --release --locked --no-default-features --features youtube \
            2>&1 | tee features.log

      - name: Check what the one-site build is
        if: steps.one.outcome == 'success'
        shell: bash
        run: python3 packaging/tests/features.py target/one/release/tafas target/release/tafas

      - name: Publish the failure
        if: steps.one.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `features` — a site could not be compiled out'
            echo '```'
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" features.log \
              | tail -n 60
            echo '```'
          } > features.md
          gh pr comment "$number" --body-file features.md || true

      - name: Fail the job
        if: steps.one.outcome == 'failure'
        shell: bash
        run: exit 1

