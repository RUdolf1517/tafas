name: ci

# Every job runs on a push and on a pull request. The one exception would be
# `licenses`, whose cadence is argued in its own comment — but the trigger is
# still this one: the job decides to run, not the event.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  # The three platforms a downloader is expected to run on. No test touches the
  # network: the fixtures in `tests/` build their own HTTP server.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The generators are Python, and three of them produce files that ship.
      # They are exercised here rather than only in the release job, because a
      # generator that broke is a release that fails at 2 a.m.: `channels.py
      # --self-test` renders the AUR, Scoop and flake files from a stand-in
      # release and asserts the hashes and the versions in them, and the winget
      # generator is rendered against a stand-in archive and checked.
      - name: Channel generators
        id: channels
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/channels.py --self-test
          # The generator refuses an archive that is not exactly `tafas.exe` and
          # `LICENSE`, so the stand-in is a real ZIP with those two entries.
          mkdir -p /tmp/winget-check/build
          printf 'tafas.exe\n' > /tmp/winget-check/build/tafas.exe
          printf 'MIT\n' > /tmp/winget-check/build/LICENSE
          (cd /tmp/winget-check/build && python3 -c "import zipfile; \
            z = zipfile.ZipFile('../tafas-x86_64-pc-windows-msvc.zip', 'w'); \
            z.write('tafas.exe'); z.write('LICENSE'); z.close()")
          python3 packaging/winget/generate.py --tag v9.9.9 \
            --windows-archive /tmp/winget-check/tafas-x86_64-pc-windows-msvc.zip \
            --output-dir /tmp/winget-check/manifests
          python3 packaging/winget/tests/check.py /tmp/winget-check/manifests
          # The `.apk` packer. It replaced `apk mkpkg` in a container, which
          # never made a package: `mkpkg` is apk-tools 3 and `alpine:3.20` has
          # 2.14, and the v3 format it writes is unreadable to most installs
          # that install a package by path.
          python3 packaging/tests/apk.py
          # The Homebrew formula is the one artifact that repeats a hash by hand,
          # and nothing checked it: 0.3.0 shipped four zeroes. It is checked
          # against the *latest* release's SHA256SUMS, over the network; that
          # part is a step of its own below.

      # The formula's four hashes are the one place a release hash is written by
      # hand, and the one place nothing checked. It is compared with the latest
      # release's own `SHA256SUMS`, so the check cannot be fooled by the formula
      # and the release agreeing with each other.
      #
      # `continue-on-error` here is deliberate and is not the `skipped`-step
      # mistake this workflow was fixed for: the step always runs, its outcome is
      # always reported, and the job's verdict does not depend on a third party
      # being reachable. The failure that matters — a hash that is not the
      # release's — is printed in full in the step log below it.
      - name: The Homebrew formula matches the release
        id: formula
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl -sS -m 30 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          echo "comparing Formula/tafas.rb with $tag"
          python3 packaging/tests/formula.py --release "$tag" 2>&1 | tee formula.log

      # Every step below is guarded by `!cancelled()` and *not* by the outcome of
      # the one before it. Two runs proved why: clippy failed, `continue-on-error`
      # recorded that as `outcome: failure` while the job's conclusion stayed
      # `success`, and `if: steps.clippy.outcome == 'success'` then skipped `Test`
      # and `Release build` — a green job that ran no test at all. The outcome of
      # each step is reported by `Publish the failure` and turned into a failed
      # job by `Fail the job`; it is not a reason to run less.
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log

      # `--all-targets` covers the unit, integration, example and bench targets
      # and deliberately *not* the doc-tests, which are their own target group.
      # The examples in `src/lib.rs` are the public API documentation: a library
      # user copies them, so a release that publishes examples nobody compiled is
      # the failure this step exists for.
      - name: Test
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # Not `set -e`, deliberately: a failing `--all-targets` must not stop
          # the doc-tests from running, because the report is built from one log
          # and a log that ends at the first failure hides the second. `PIPESTATUS`
          # is the exit code of `cargo` rather than of `tee`, and the two are
          # kept separately: the step's outcome answers "did anything fail", not
          # "did the last thing fail".
          #
          # Not a brace group around both runs to save the repetition either: a
          # group in a pipeline is a subshell, so the status it sets is discarded
          # and the step reports success while the log shows a panic.
          status=0
          { cargo test --all-targets; } 2>&1 | tee test.log | tail -n 40
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          { cargo test --doc; } 2>&1 | tee -a test.log | tail -n 40
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          exit "$status"

      - name: Release build
        id: build
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: cargo build --release 2>&1 | tee build.log

      - name: Publish the failure
        if: always() && (steps.channels.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a pull_request event `github.ref_name` is `<branch>/merge`, which
          # matches no branch that has a pull request, so the report was written
          # to the job log and lost exactly when it was needed.
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          # Only the steps that actually failed: a passing clippy log would
          # otherwise be published under a failing test's name.
          : > failure.md
          for pair in "channels:${{ steps.channels.outcome }}" "clippy:${{ steps.clippy.outcome }}" "test:${{ steps.test.outcome }}" "build:${{ steps.build.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            [ "$outcome" = "failure" ] || continue
            log="${name}.log"
            [ -f "$log" ] || continue
            # Cargo's own progress lines are removed: a log where the errors are
            # buried under 200 "Downloaded" lines is a log nobody reads.
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" "$log" \
              | tail -n 150 > "failure-$name.txt" || true
            # The verdict is the line that names the failing test, and it is not
            # guaranteed to be inside the tail: a run whose failures are reported
            # in the middle and whose last lines are "error: test failed" would
            # have its cause cut off. Collected separately so it always survives.
            # `thread*` rather than `thread *`: cargo indents a panic once it is
            # inside a test's captured output, and an anchored pattern is how the
            # earlier version of this report missed it.
            grep -E "^ *(test .*\.\.\. FAILED|thread.*panicked|error(:|\[)|warning: unused)" "$log" \
              > "verdict-$name.txt" || true
            # The panic's own message is on the next line, and it is the sentence
            # that says what went wrong.
            grep -A1 "panicked at" "$log" >> "verdict-$name.txt" || true
            {
              echo "### \`${{ matrix.os }}\` — \`$name\`"
              if [ -s "verdict-$name.txt" ]; then
                echo
                echo 'What failed:'
                echo '```'
                head -n 12 "verdict-$name.txt"
                echo '```'
              fi
              echo
              echo '```'
              cat "failure-$name.txt"
              echo '```'
            } >> failure.md
          done

          cat failure.md
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          gh pr comment "$number" --body-file failure.md || true

      # The job fails when any step's *outcome* is a failure, and not when
      # `failure()` is true. `continue-on-error` is what stopped `failure()` from
      # being true here: clippy failed, the job was green, and the only sign was
      # a step whose outcome nobody read. This is the step that reads it.
      - name: Fail the job
        if: always()
        shell: bash
        env:
          CHANNELS: ${{ steps.channels.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          failed=""
          for pair in "channels:${CHANNELS:-skipped}" "clippy:${CLIPPY:-skipped}" \
                      "test:${TEST:-skipped}" "build:${BUILD:-skipped}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            # A step that was skipped is not a pass either: `Test` skipped is a
            # run that built nothing and tested nothing.
            case "$outcome" in
              success) ;;
              *) failed="$failed $name($outcome)" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "these steps did not succeed:$failed"
            exit 1
          fi

  # A downloader is allowed to grow; it is not allowed to grow silently. The two
  # numbers in `packaging/budgets.json` — the size of the binary and the time it
  # takes to print its own name — are compared against here, on one platform,
  # because a budget that is only printed is a budget nobody reads.
  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Check the budget
        id: budget
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 packaging/tests/budgets.py target/release/tafas | tee budget.log

      # Same reason as the `test` job: the numbers that failed are published
      # where the reader is, not only in a log this project cannot always reach.
      - name: Publish what was measured
        if: steps.budget.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `budgets` — the numbers this build has'
            echo '```'
            tail -n 40 budget.log
            echo '```'
          } > budget.md
          gh pr comment "$number" --body-file budget.md || true

      - name: Fail the job
        if: steps.budget.outcome == 'failure'
        shell: bash
        run: exit 1

  # `rust-version = "1.82"` is a promise, and a promise nobody builds is a wish.
  # One build at the declared floor is enough to notice a dependency that moved
  # it, which is the failure mode this job exists for.
  msrv:
    name: msrv (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"

      - name: Build at the declared floor
        id: floor
        continue-on-error: true
        shell: bash
        run: cargo build --locked --all-targets 2>&1 | tee msrv.log

      - name: Publish the failure
        if: steps.floor.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `msrv` — the declared floor does not build'
            echo '```'
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" msrv.log \
              | tail -n 80
            echo '```'
          } > msrv.md
          gh pr comment "$number" --body-file msrv.md || true

      - name: Fail the job
        if: steps.floor.outcome == 'failure'
        shell: bash
        run: exit 1

  # One feature per site is a promise about the binary, not a runtime check:
  # a build without Vimeo must contain no Vimeo code. This job builds both
  # halves of that promise — the full binary and a youtube-only one — and
  # `packaging/tests/features.py` says what is wrong if they disagree.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build every site
        shell: bash
        run: cargo build --release --locked

      - name: Build one site
        id: one
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A different target directory, so the full build below cannot be
          # served a binary that was compiled without the other six sites.
          CARGO_TARGET_DIR=target/one \
            cargo build --release --locked --no-default-features --features youtube \
            2>&1 | tee features.log

      - name: Check what the one-site build is
        if: steps.one.outcome == 'success'
        shell: bash
        run: python3 packaging/tests/features.py target/one/release/tafas target/release/tafas

      - name: Publish the failure
        if: steps.one.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          {
            echo '### `features` — a site could not be compiled out'
            echo '```'
            grep -vE "^ *(Downloading|Downloaded|Compiling|Checking|Updating|Adding|Locking)" features.log \
              | tail -n 60
            echo '```'
          } > features.md
          gh pr comment "$number" --body-file features.md || true

      - name: Fail the job
        if: steps.one.outcome == 'failure'
        shell: bash
        run: exit 1


  # The licence in the readme is a claim, and `deny.toml` is the file that
  # checks it. Until this job existed, `cargo deny` ran nowhere: three pages said
  # it ran "when a release is cut", `release.yml` has never mentioned it, and
  # neither had CI. A configuration for a command nobody runs is a claim nobody
  # checks.
  #
  # It runs on every commit rather than only when the lockfile moves. The reason
  # `cargo audit` is not per-commit is that its database moves independently of
  # this repository — a build that was perfect on Friday is red on Monday for a
  # reason nobody here caused. `deny.toml` does not depend on a moving database
  # for the checks that matter here: it is licences, banned crates and sources,
  # all of which are decided by the tree. A minute of runner time on every commit
  # is a cheaper thing to spend than an argument about when to remember.
  # Advisories are the moving part, so they live in `audit.yml` on a schedule
  # instead; see docs/dependencies.md §0.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `--all-features` because the default build is not the only one a reader
      # compiles: `--no-default-features --features youtube` is documented, and a
      # dependency reached only from one site's code has to pass the same test.
      - name: cargo deny check
        id: deny
        continue-on-error: true
        shell: bash
        run: cargo deny --all-features check 2>&1 | tee deny.log

      - name: Publish the failure
        if: steps.deny.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          number="$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -z "$number" ]; then
            echo "no open pull request for $HEAD_BRANCH; see the step log"
            exit 0
          fi
          # The comment is the only channel: the job log lives behind a blob URL
          # that expires, so what is here is what a reader gets. Reporting
          # `tail -n 80` put 80 lines of `license-not-encountered` warnings in
          # the first such comment and cut the error that caused the failure —
          # so the verdict comes first, then the diagnostics from the first
          # error onwards, and warnings only when there is no error at all.
          {
            echo '### `licenses` — a dependency is not allowed here'
            echo
            echo '```'
            grep -E '^(advisories|bans|licenses|sources) .*(ok|FAILED)' deny.log | tail -n 1 || true
            echo
            if grep -q '^error' deny.log; then
              awk '/^error/ {keep=1} keep' deny.log | head -n 120
            else
              tail -n 60 deny.log
            fi
            echo '```'
            echo
            echo 'The whole run is in the job log; `cargo deny check` locally'
            echo 'reproduces it. Licences are listed in `deny.toml`.'
          } > deny.md
          gh pr comment "$number" --body-file deny.md || true

      - name: Fail the job
        if: steps.deny.outcome == 'failure'
        shell: bash
        run: exit 1
