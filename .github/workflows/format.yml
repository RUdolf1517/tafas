name: format

# Formatting and the lockfile are the two things a machine can decide better
# than a person, and the two things a contributor without a working `cargo`
# cannot produce. This job runs `cargo fmt` and resolves `Cargo.lock`, then
# commits the result back to the branch it was pushed to. It never touches
# `main` on a pull request, and it commits nothing when there is nothing to do.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  format:
    name: cargo fmt + lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Resolve the lockfile
        run: cargo generate-lockfile

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already formatted; nothing to commit"
            exit 0
          fi
          git config user.name "tafas-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt + Cargo.lock (automated)"
          git push origin "HEAD:${{ github.ref_name }}"
