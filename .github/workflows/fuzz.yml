name: fuzz

# Out of band on purpose: a fuzzer that gates a merge is a fuzzer people learn to
# ignore. Weekly, and on demand. A crash arrives as an artifact under
# `fuzz/artifacts/`, which is committed with the fix and replayed by hand.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [mp4_read, webvtt, json_after, mux_file]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: run
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
