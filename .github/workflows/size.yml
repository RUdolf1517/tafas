name: size (temporary measurement)

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/size.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  measure:
    name: size (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [base, lean, optz, lean-optz]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Make this variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          variant = os.environ["VARIANT"]
          p = pathlib.Path("Cargo.toml")
          s = p.read_text()
          if "lean" in variant:
              s = s.replace('    "charset",\n', '').replace('    "http2",\n', '')
          if "optz" in variant:
              s = s.replace('opt-level = 3\n', 'opt-level = "z"\n')
          p.write_text(s)
          print(s[s.index("[dependencies]"):s.index("[dev-dependencies]")][:600])
          PY
      - name: Build
        shell: bash
        run: cargo build --release 2>&1 | tail -5
      - name: Report the size
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bytes=$(stat -c %s target/release/tafas)
          echo "$VARIANT: $bytes bytes"
          # An annotation is the only part of a job this sandbox can read back:
          # the log is behind a signed blob URL and the artifact behind another.
          echo "::warning title=size $VARIANT::variant=$VARIANT bytes=$bytes"
      - name: Startup time
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          best=999999
          for i in $(seq 1 7); do
            start=$(date +%s%N)
            ./target/release/tafas --version > /dev/null
            end=$(date +%s%N)
            ms=$(( (end - start) / 1000000 ))
            if [ "$ms" -lt "$best" ]; then best=$ms; fi
          done
          echo "startup $VARIANT: ${best}ms"
          echo "::warning title=startup $VARIANT::variant=$VARIANT millis=$best"
