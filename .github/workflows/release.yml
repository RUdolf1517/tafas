name: release

# Builds the shipped artifacts. Triggered when a release is published, so the
# release notes can be written first; the binaries are attached a few minutes
# later. Nothing here is built by hand.
#
# Asset names are the Rust target triples and carry no version, which is what
# makes https://github.com/RUdolf1517/tafas/releases/latest/download/<asset> a
# stable URL for install.sh.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to build artifacts for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl: no libc dependency, runs anywhere with a 3.2+ kernel.
          # `ring` compiles vendored C, so the build needs `musl-gcc`, which
          # `musl-tools` provides.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # ARM64 is cross-compiled with zig as the C compiler, because `ring`'s
          # vendored C has to be built for the target and a plain `rust-lld` link
          # would fail on it. No developer machine is involved either way.
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install zig for the aarch64 cross build
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/tafas"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            # Built for another architecture: assert what the file *is* rather
            # than pretending to have run it.
            kind="$(file -b "$bin")"
            echo "$kind"
            case "$kind" in *"ARM aarch64"*) ;; *) echo "not an aarch64 binary" >&2; exit 1 ;; esac
            case "$kind" in *"statically linked"*|*"static-pie linked"*) ;; *) echo "not statically linked" >&2; exit 1 ;; esac
            exit 0
          fi
          "$bin" --version
          "$bin" --capabilities > /dev/null
          # A usage error must be exit 2 and must not touch the network.
          if "$bin" --quality nope https://youtu.be/x >/dev/null 2>&1; then
            echo "an invalid quality exited 0" >&2
            exit 1
          else
            [ $? -eq 2 ] || { echo "an invalid quality did not exit 2" >&2; exit 1; }
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tafas-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/tafas"
          mkdir -p dist

          if [ -f "${bin}.exe" ]; then
            cp "${bin}.exe" dist/tafas.exe
            cp LICENSE dist/
            (cd dist && 7z a "../${name}.zip" tafas.exe LICENSE > /dev/null)
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" dist/tafas
            chmod +x dist/tafas
            cp LICENSE dist/
            mkdir -p dist/man dist/completions
            cp man/tafas.1 dist/man/
            # Completions are generated from the shipped binary, so the archive
            # cannot contain a script that disagrees with its own parser.
            dist/tafas --completions bash > dist/completions/tafas.bash
            dist/tafas --completions zsh > dist/completions/_tafas
            dist/tafas --completions fish > dist/completions/tafas.fish
            (cd dist && tar czf "../${name}.tar.gz" tafas LICENSE man completions)
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l ./*.tar.gz ./*.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Linux packages
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if command -v nfpm >/dev/null 2>&1; then
            bash packaging/linux-packages.sh "${TAG#v}" artifacts
          else
            curl -fsSL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_amd64.deb \
              -o /tmp/nfpm.deb && sudo dpkg -i /tmp/nfpm.deb
            bash packaging/linux-packages.sh "${TAG#v}" artifacts
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
